name: Build Nova FGL APK
on:
  workflow_dispatch:
  push:
    branches:
      - fix/samsung-a16-usb-access
    paths:
      - '.github/workflows/build-fgl.yml'
      - 'patches/samsung-a16/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout FGL patches
        uses: actions/checkout@v4
        with:
          path: fgl
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK API 36 and tools
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
      - name: Install repo launcher
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Sync original Nova multi-repository source
        run: |
          mkdir source
          cd source
          "$HOME/bin/repo" init -u https://github.com/nova-video-player/aos-AVP -b nova
          "$HOME/bin/repo" sync -j4 --fail-fast
          "$HOME/bin/repo" forall -c 'git checkout -B local-fgl "$REPO_LREV" || true'
      - name: Apply Samsung storage and FGL label patches
        working-directory: source
        run: |
          python3 ../fgl/patches/samsung-a16/apply_all_files_access.py
          python3 ../fgl/patches/samsung-a16/apply_usb_saf_fix.py
          python3 ../fgl/patches/samsung-a16/apply_fgl_name.py
      - name: Compile FGL debug APK using Nova special-storage flavor
        working-directory: source/Video
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -Puniversal assembleManageexternalstorageDebug
      - name: Rename FGL APK
        run: |
          mkdir -p artifacts
          find source/Video/build/outputs/apk -type f -name '*.apk' -print
          apk="$(find source/Video/build/outputs/apk/manageexternalstorage/debug -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" artifacts/Nova-FGL-Samsung-A16-v1-debug.apk
          sha256sum artifacts/*.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-FGL-Samsung-A16-v1
          path: artifacts/Nova-FGL-Samsung-A16-v1-debug.apk
          if-no-files-found: error
